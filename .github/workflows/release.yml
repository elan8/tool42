name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allows manual triggering

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            artifact_name: tool42-x86_64-unknown-linux-gnu
            binary_name: tool42
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            artifact_name: tool42-x86_64-pc-windows-msvc
            binary_name: tool42.exe
          - os: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin
            artifact_name: tool42-x86_64-apple-darwin
            binary_name: tool42
          - os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
            artifact_name: tool42-aarch64-apple-darwin
            binary_name: tool42

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add target for cross-compilation (if needed)
        shell: bash
        run: |
          HOST_TARGET=$(rustc -vV | grep host | cut -d' ' -f2)
          if [ "${{ matrix.target }}" != "$HOST_TARGET" ]; then
            rustup target add ${{ matrix.target }}
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Create release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} release/
          tar -czf release/${{ matrix.artifact_name }}.tar.gz -C release ${{ matrix.binary_name }}

      - name: Create release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" -Destination "release\"
          Compress-Archive -Path "release\${{ matrix.binary_name }}" -DestinationPath "release\${{ matrix.artifact_name }}.zip" -Force

      - name: Upload release artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload release artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create release notes
        id: release_notes
        shell: bash
        run: |
          cat > release-notes.md << EOF
          # Tool42 ${{ steps.version.outputs.version }}

          ## Downloads

          ### Linux (x86_64)
          - \`tool42-x86_64-unknown-linux-gnu.tar.gz\`

          ### Windows (x86_64)
          - \`tool42-x86_64-pc-windows-msvc.zip\`

          ### macOS
          - \`tool42-x86_64-apple-darwin.tar.gz\` (Intel)
          - \`tool42-aarch64-apple-darwin.tar.gz\` (Apple Silicon)

          ## Installation

          Extract the archive and add the binary to your PATH.

          ## Changes

          See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          EOF
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

